# Packs the Arc4u Cyphertool CLI as a .NET tool with one Native AOT package per platform.
#
# Native AOT only compiles for the OS it runs on, so each platform package is built on a matching runner:
#   - Arc4u.Cyphertool               top-level package: lists the platform packages (built on macOS)
#   - Arc4u.Cyphertool.<rid>          native executable for osx-arm64, osx-x64, linux-x64, linux-arm64, win-x64, win-arm64
# 'dotnet tool install' picks the right one; there is deliberately no framework-dependent ('any') package, so the tool
# cannot be installed on another platform. Every package must be pushed with the same version: the top-level
# package names each platform package, and an install fails on a platform whose package is missing.
#
# Configuration (Settings > Secrets and variables > Actions):
#   secrets.NUGET_USER  the nuget.org account (profile name) owning the packages, used to push them
#
# The packages are pushed to nuget.org with Trusted Publishing, as Arc4u does: GitHub OIDC is exchanged for a
# short-lived API key by NuGet/login, so no API key is stored. This needs a Trusted Publishing policy on nuget.org
# for this repository and the workflow file pack-tool.yml.

name: Pack CLI tool

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g. 2.0.0-preview01). Empty = the <Version> of Arc4u.Cyphertool.csproj
        type: string
        default: ''
      push:
        description: Push the packages to nuget.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pack-tool-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/Arc4u.Cyphertool.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Pack ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No -r: builds the top-level package and the packages of the current OS (osx-arm64 and osx-x64).
          - name: top-level + osx
            artifact: top-level-osx
            os: macos-latest
            args: ''
            smoke: src/bin/Release/net11.0/osx-arm64/publish/Arc4u.Cyphertool
          - name: linux-x64
            artifact: linux-x64
            os: ubuntu-latest
            args: -r linux-x64
            smoke: src/bin/Release/net11.0/linux-x64/publish/Arc4u.Cyphertool
          - name: linux-arm64
            artifact: linux-arm64
            os: ubuntu-24.04-arm
            args: -r linux-arm64
            smoke: src/bin/Release/net11.0/linux-arm64/publish/Arc4u.Cyphertool
          - name: win-x64
            artifact: win-x64
            os: windows-latest
            args: -r win-x64
            smoke: src/bin/Release/net11.0/win-x64/publish/Arc4u.Cyphertool.exe
          # Cross-compiled on x64 with the Visual Studio ARM64 build tools: cannot be run on this runner.
          - name: win-arm64
            artifact: win-arm64
            os: windows-latest
            args: -r win-arm64
            smoke: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The version comes from the tag (v2.0.0-preview01 => 2.0.0-preview01), else from the 'version' input,
      # else from <Version> in the csproj. Every matrix job resolves the same value, so all packages match.
      - name: Pack
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          fi
          if [ -n "$version" ]; then
            echo "Packing version $version"
            dotnet pack "$PROJECT" -c Release ${{ matrix.args }} -o artifacts "-p:Version=$version"
          else
            dotnet pack "$PROJECT" -c Release ${{ matrix.args }} -o artifacts
          fi

      - name: Smoke test the native executable
        if: matrix.smoke != ''
        shell: bash
        run: '"${{ matrix.smoke }}" --version'

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.artifact }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  collect:
    name: Collect and push
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token, exchanged for a nuget.org API key by NuGet/login
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          path: artifacts
          merge-multiple: true

      # Fail rather than publish a top-level package pointing to a platform package that does not exist.
      - name: Check every package was built
        shell: bash
        run: |
          ls -l artifacts
          top=$(ls artifacts/*.nupkg | grep -vE '\.(osx|linux|win)-[a-z0-9]+\.' )
          [ "$(echo "$top" | wc -l)" -eq 1 ] || { echo "::error::Expected exactly one top-level package."; exit 1; }
          for rid in osx-arm64 osx-x64 linux-x64 linux-arm64 win-x64 win-arm64; do
            ls artifacts/*.$rid.*.nupkg > /dev/null 2>&1 || { echo "::error::Missing the $rid package."; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tool-packages
          path: artifacts/*.nupkg

      - uses: actions/setup-dotnet@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push
        with:
          dotnet-version: 10.0.x

      # Get the short-lived API key only now, once every package is built, so that it does not expire before the push.
      - name: NuGet login (OIDC → temp API key)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Platform packages first, then the top-level one: an install never sees a top-level package whose
      # platform packages are not on the feed yet.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push
        shell: bash
        env:
          SOURCE: https://api.nuget.org/v3/index.json
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in $(ls artifacts/*.nupkg | grep -E '\.(osx|linux|win)-[a-z0-9]+\.'); do
            dotnet nuget push "$pkg" --source "$SOURCE" --api-key "$API_KEY" --skip-duplicate
          done
          for pkg in $(ls artifacts/*.nupkg | grep -vE '\.(osx|linux|win)-[a-z0-9]+\.'); do
            dotnet nuget push "$pkg" --source "$SOURCE" --api-key "$API_KEY" --skip-duplicate
          done
